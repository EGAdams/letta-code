              - heading "Recommended order of work (fastest practical path)" [level=3] [ref=f16e164]
              - list [ref=f16e165]:
                - listitem [ref=f16e166]:
                  - strong [ref=f16e167]: Build the master 2025 document checklist first.
                  - text: Do not keep processing blindly. List every expected church account/month/document type and mark each as scanned, processed, categorized, duplicate-checked, stored, or missing.
                - listitem [ref=f16e168]:
                  - strong [ref=f16e169]: Finish statement coverage before chasing individual receipts.
                  - text: The fastest way to close the books is to guarantee all church statements are present and fully processed month by month; that establishes the complete transaction backbone.
                - listitem [ref=f16e170]:
                  - strong [ref=f16e171]: Resolve all remaining statement FAIL / PASS-WITH-NOTES items that affect completeness.
                  - text: January is close enough that its exceptions should be closed immediately rather than rediscovered later.
                - listitem [ref=f16e172]:
                  - strong [ref=f16e173]: Clear uncategorized expenses next.
                  - text: "Once statement coverage is stable, work the 72 uncategorized rows in descending month-count order: June, March, May, April."
                - listitem [ref=f16e174]:
                  - strong [ref=f16e175]: Then attach receipts/invoices/supporting docs to already-stored transactions.
                  - text: This is faster than trying to reconstruct the whole year from receipts first.
                - listitem [ref=f16e176]:
                  - strong [ref=f16e177]: Then review unmatched receipts and possible duplicates.
                  - text: Anything still unmatched after full statement coverage becomes a short exception queue instead of a giant mixed backlog.
                - listitem [ref=f16e178]:
                  - strong [ref=f16e179]: Only after the above, produce the final church 2025 report package.
              - heading "Milestones and completion criteria" [level=3] [ref=f16e180]
              - list [ref=f16e181]:
                - listitem [ref=f16e182]:
                  - strong [ref=f16e183]: Milestone 1 — Source inventory complete.
                  - text: "Completion criteria: every expected 2025 church document is listed, and each one is marked either processed and stored in the correct folder or explicitly missing/pending human retrieval."
                - listitem [ref=f16e184]:
                  - strong [ref=f16e185]: Milestone 2 — Statement backbone complete.
                  - text: "Completion criteria: every 2025 church statement has been scanned or ingested, archived to the correct year/month/account path, parsed, duplicate-checked, and stored; statement totals reconcile; open statement FAILs are resolved or formally excluded with justification."
                - listitem [ref=f16e186]:
                  - strong [ref=f16e187]: Milestone 3 — Transaction classification complete.
                  - text: "Completion criteria: zero church expenses remain uncategorized unless they are intentionally held for documented policy review."
                - listitem [ref=f16e188]:
                  - strong [ref=f16e189]: Milestone 4 — Supporting documents linked.
                  - text: "Completion criteria: each receipt/invoice/supporting document is either matched to a stored transaction, linked as a counterpart/support document, or placed on a short human-review exception list."
                - listitem [ref=f16e190]:
                  - strong [ref=f16e191]: Milestone 5 — Year-end reconciliation complete.
                  - text: "Completion criteria: no unresolved duplicate candidates, missing statements, unexplained unmatched receipts, or known total discrepancies remain in the church 2025 data set."
                - listitem [ref=f16e192]:
                  - strong [ref=f16e193]: Milestone 6 — Final financial report ready.
                  - text: "Completion criteria: year totals can be produced from verified data, with category summaries and supporting documents in place, and the remaining exception list is empty or explicitly approved by a human."
              - heading "Blockers requiring human assistance" [level=3] [ref=f16e194]
              - list [ref=f16e195]:
                - listitem [ref=f16e196]: Locating any church statements, receipts, invoices, or check images that were never scanned or are only present as paper originals.
                - listitem [ref=f16e197]: Answering ambiguous categorization policy questions where the statement text is too vague to distinguish business/church/personal purpose.
                - listitem [ref=f16e198]: Providing context for check numbers, transfers, and card payments that do not expose enough merchant detail in the source statement.
                - listitem [ref=f16e199]: Confirming whether missing later-month statements actually exist, belong to the church accounts, or were intentionally not used.
                - listitem [ref=f16e200]: Approving treatment of any lingering support-only or excluded documents that should not create accounting rows.
              - heading "Fast completion strategy" [level=3] [ref=f16e201]
              - paragraph [ref=f16e202]:
                - text: The quickest accurate route is to treat this as a
                - strong [ref=f16e203]: coverage problem first, cleanup problem second
                - text: . First prove the full 2025 church statement set exists and is processed into the database. Second, clear the remaining uncategorized and unsupported rows. Third, link receipts and invoices to transactions already known to exist. This avoids the slow path of trying to reconstruct the year document-by-document without first knowing whether the transaction backbone is complete.
              - paragraph [ref=f16e204]:
                - strong [ref=f16e205]: "Immediate next actions:"
              - list [ref=f16e206]:
                - listitem [ref=f16e207]: "Chase the three accounts with genuine document gaps first: Fifth Third ROL 6285 (May–Dec), Fifth Third Personal 5938 (Aug–Dec), and Fifth Third ROL 3119 (Oct–Dec) — confirm whether these statements exist anywhere (paper, online banking portal, email) before assuming they were never generated."
                - listitem [ref=f16e208]: Debug the Fifth Third ROL 3119 import pipeline — every processing attempt on record has failed, so even the documents already on hand (Jan–Sep) haven't produced usable data.
                - listitem [ref=f16e209]: "Process the already-present-but-unimported statements: FNBO 4851 (Feb–Dec), Diners Club 0587/1391 (Feb–Dec), JetBlue Barclays 3965 (Mar–Dec), and Prime Chase (Jul–Dec) — these are pure processing work, no document chasing required."
                - listitem [ref=f16e210]: Work down the 104 uncategorized expenses, starting with March (38) and June (28).
                - listitem [ref=f16e211]: Generate the final year-level exception list, then produce the church financial report from only the verified rows.
