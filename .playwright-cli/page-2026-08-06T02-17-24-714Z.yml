              - paragraph [ref=f16e10]: Verify that financial data extracted from statements, receipts, and other documents is accurate, categorized correctly, deduplicated, and safely stored in the non-profit finance database.
            - generic [ref=f16e11]:
              - heading "1 Verify Extracted Statement Data" [level=2] [ref=f16e12]:
                - generic [ref=f16e13]: "1"
                - text: Verify Extracted Statement Data
              - paragraph [ref=f16e14]: Some source documents may be fuzzy, OCR-generated, or manually translated into structured data.
              - paragraph [ref=f16e15]: "For every statement or financial document:"
              - list [ref=f16e16]:
                - listitem [ref=f16e17]: Extract usable transaction data.
                - listitem [ref=f16e18]: Use a Python/calculator tool to verify totals.
                - listitem [ref=f16e19]: Confirm that individual expenses, deposits, and balances add up correctly.
                - listitem [ref=f16e20]: Flag any math mismatch before inserting data into the database.
            - generic [ref=f16e21]:
              - heading "2 Determine vendor_key and Category" [level=2] [ref=f16e22]:
                - generic [ref=f16e23]: "2"
                - text: Determine
                - code [ref=f16e24]: vendor_key
                - text: and Category
              - paragraph [ref=f16e25]:
                - text: For each expense, determine the correct
                - code [ref=f16e26]: vendor_key
                - text: from the transaction description.
              - paragraph [ref=f16e27]:
                - text: After the
                - code [ref=f16e28]: vendor_key
                - text: "is identified:"
              - list [ref=f16e29]:
                - listitem [ref=f16e30]: Look up the vendor in the existing lookup tools.
                - listitem [ref=f16e31]: Assign the correct expense category.
                - listitem [ref=f16e32]: If the vendor is unknown, add it to the evolving lookup list after review.
              - paragraph [ref=f16e33]:
                - strong [ref=f16e34]: "Location of tools for this system:"
              - code [ref=f16e36]: /home/adamsl/rol_finances/tools/
              - paragraph [ref=f16e37]: This folder also contains lookup lists that grow as new vendors and categories are discovered.
            - generic [ref=f16e38]:
              - heading "3 Prevent Duplicate Data" [level=2] [ref=f16e39]:
                - generic [ref=f16e40]: "3"
                - text: Prevent Duplicate Data
              - paragraph [ref=f16e41]: The system must prevent the same transaction from being entered more than once.
              - paragraph [ref=f16e42]: Sometimes receipt data and bank statement data may describe the same real-world transaction. For example, a receipt may have a matching bank statement row, or a bank statement row may have matching receipt data.
              - paragraph [ref=f16e43]: When the system finds a match, the records should be linked together instead of being inserted as separate expenses.
              - paragraph [ref=f16e44]: The system should also guard against accidental duplicate entries where the same record is entered more than once.
            - generic [ref=f16e45]:
              - heading "4 Store Verified Data in the Database" [level=2] [ref=f16e46]:
                - generic [ref=f16e47]: "4"
                - text: Store Verified Data in the Database
              - paragraph [ref=f16e48]: Only insert or update data after verification is complete.
              - paragraph [ref=f16e49]: "When matching data is found:"
              - list [ref=f16e50]:
                - listitem [ref=f16e51]:
                  - text: If data from a receipt matches an existing expense record from a statement, populate the
                  - code [ref=f16e52]: receipt_url
                  - text: column of that expense record with the path to the receipt.
                - listitem [ref=f16e53]:
                  - text: If data from a statement matches an existing expense record from a receipt, populate the
                  - code [ref=f16e54]: source_file
                  - text: column of that expense record with the document path.
                - listitem [ref=f16e55]:
                  - text: Verify that the
                  - code [ref=f16e56]: vendor_key
                  - text: and category match between the linked records.
              - paragraph [ref=f16e57]:
                - text: If the
                - code [ref=f16e58]: vendor_key
                - text: "or category does not match:"
              - generic [ref=f16e59]: HALT THE PROCESS
              - paragraph [ref=f16e60]: The mismatch must be reviewed and resolved before continuing.
