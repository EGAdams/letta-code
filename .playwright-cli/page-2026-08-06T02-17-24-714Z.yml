                  - strong [ref=f16e150]: "Folder normalization:"
                  - text: invoices and supporting documents still have no dedicated top-level folders; several accounts (6285, 5938, 3119, JetBlue, Diners) have real source documents scattered across the legacy month folders, the year-folder structure, and the readable_documents root itself — worth consolidating so future gap-audits don't have to re-derive this.
