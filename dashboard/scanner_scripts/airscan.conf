# Static eSCL routes for the two dashboard scanners. WSL does not receive the
# LAN multicast discovery packets that sane-airscan normally uses, so address
# both devices directly and avoid Windows WIA/WSD state entirely.
[devices]
"Window Scanner" = https://10.0.0.26/eSCL, eSCL
"Freezer Scanner" = http://10.0.0.243/eSCL, eSCL

[options]
discovery = disable
